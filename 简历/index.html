<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梁楚盈 · 个人简历</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --text:#3d3552;
  --text-soft:#5d5480;
  --primary:#a78bfa;
  --primary-deep:#8b6ee8;
  --primary-soft:rgba(233,225,252,.85);
  --accent:#f0abfc;
  --card:rgba(255,255,255,.72);
  --card-border:rgba(255,255,255,.65);
  --line:#e6dcf7;
  --shadow:0 8px 32px rgba(139,110,232,.18);
  --shadow-hover:0 16px 44px rgba(139,110,232,.30);
  --nav-bg:rgba(250,247,255,.7);
  --overlay:linear-gradient(180deg,rgba(250,246,255,.38),rgba(243,236,253,.26) 45%,rgba(250,246,255,.44));
  --bar-track:rgba(255,255,255,.5);
}
[data-theme="dark"]{
  --text:#ece7f8;
  --text-soft:#c3b9de;
  --primary:#b79cff;
  --primary-deep:#c4aaff;
  --primary-soft:rgba(58,47,85,.8);
  --card:rgba(34,26,52,.62);
  --card-border:rgba(183,156,255,.28);
  --line:#3d3358;
  --shadow:0 8px 32px rgba(0,0,0,.4);
  --shadow-hover:0 16px 44px rgba(0,0,0,.55);
  --nav-bg:rgba(27,22,38,.68);
  --overlay:linear-gradient(180deg,rgba(24,18,38,.55),rgba(32,24,50,.42) 45%,rgba(24,18,38,.6));
  --bar-track:rgba(0,0,0,.35);
}
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  color:var(--text);line-height:1.7;overflow-x:hidden;
  background:linear-gradient(160deg,#a68de8,#cf9fe8 55%,#9b86e0); /* 视频加载前的兜底背景（银河紫） */
  transition:color .3s;
}
a{color:inherit;text-decoration:none}
.container{max-width:1080px;margin:0 auto;padding:0 24px;width:100%}
h2.sec-title{
  font-size:1.75rem;font-weight:800;text-align:center;margin-bottom:8px;
  background:linear-gradient(120deg,var(--primary-deep),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sec-sub{text-align:center;color:var(--text-soft);margin-bottom:40px;font-size:.95rem}
/* ============ 视频背景层（固定 + 视差） ============ */
#video-layer{
  position:fixed;inset:0;z-index:-2;overflow:hidden;
  will-change:transform;
}
#bgVideo{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover; /* 始终铺满屏幕，自适应裁剪 */
  transform:scale(1.12); /* 预留视差位移余量 */
  will-change:transform;
}
#overlay{position:fixed;inset:0;z-index:-1;background:var(--overlay);pointer-events:none;transition:background .3s}
/* ============ 背景光晕（缓慢漂移 · 克制低透明） ============ */
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#glow i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;display:block}
#glow .g1{
  width:44vw;height:44vw;left:-10vw;top:-12vw;
  background:radial-gradient(circle,rgba(196,170,255,.55),transparent 70%);
  animation:drift1 26s ease-in-out infinite alternate;
}
#glow .g2{
  width:38vw;height:38vw;right:-8vw;bottom:-10vw;
  background:radial-gradient(circle,rgba(240,171,252,.45),transparent 70%);
  animation:drift2 32s ease-in-out infinite alternate;
}
[data-theme="dark"] #glow i{opacity:.32}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(9vw,7vh)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-8vw,-6vh)}}
/* ============ 首屏依次进场 ============ */
#heroTag,#heroName,#heroRole,#heroDesc,#heroBadges,#heroBtns{
  opacity:0;transform:translateY(22px);
  animation:heroIn .8s cubic-bezier(.22,.8,.3,1) forwards;
}
@keyframes heroIn{to{opacity:1;transform:none}}
#heroName{animation-delay:.12s}
#heroRole{animation-delay:.26s}
#heroDesc{animation-delay:.40s}
#heroBadges{animation-delay:.54s}
#heroBtns{animation-delay:.68s}
/* ============ 顶部滚动进度条 ============ */
#progressBar{
  position:fixed;top:0;left:0;height:3px;width:0;z-index:120;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:0 3px 3px 0;
}
/* ============ 导航栏（Galaxy 胶囊悬浮样式） ============ */
nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;
  width:min(1060px,calc(100% - 32px));
  background:var(--nav-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--card-border);border-radius:999px;
  box-shadow:0 8px 30px rgba(80,50,140,.16);
  transition:background .3s,box-shadow .3s,border-color .3s;
}
/* 滚动后：磨砂加深 + 投影加重，层级更清晰 */
nav.scrolled{box-shadow:0 12px 36px rgba(80,50,140,.28)}
[data-theme="dark"] nav{box-shadow:0 8px 30px rgba(0,0,0,.4)}
[data-theme="dark"] nav.scrolled{box-shadow:0 12px 36px rgba(0,0,0,.6)}
.nav-inner{max-width:1080px;margin:0 auto;padding:0 12px 0 22px;height:54px;display:flex;align-items:center;gap:16px}
.nav-name{font-weight:800;font-size:1.05rem;white-space:nowrap}
.nav-name .paw{color:var(--primary)}
.nav-links{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
.nav-links a{
  padding:6px 12px;border-radius:20px;font-size:.88rem;color:var(--text-soft);
  transition:color .2s,background .2s;white-space:nowrap;
}
.nav-links a:hover,.nav-links a.active{color:var(--primary-deep);background:var(--primary-soft)}
.nav-actions{display:flex;gap:8px;margin-left:auto} /* 链接栏隐藏时按钮依然右对齐 */
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--text);cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s,box-shadow .2s;
}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
/* ============ 滚动章节（撑出约 500vh） ============ */
.chapter{
  min-height:100vh;display:flex;align-items:center;
  padding:110px 0 60px;position:relative;scroll-margin-top:96px;
}
/* 前景玻璃拟态面板（视差层） */
.panel{
  background:var(--card);border:1px solid var(--card-border);border-radius:24px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow);padding:44px 40px;width:100%;
  will-change:transform;
}
/* ============ Hero ============ */
#hero .panel{text-align:center;padding:64px 40px}
.hero-tag{
  display:inline-block;padding:5px 16px;border-radius:20px;font-size:.82rem;
  background:var(--primary-soft);color:var(--primary-deep);margin-bottom:18px;
  border:1px dashed var(--accent);
}
.hero-name{
  font-size:clamp(2.2rem,6vw,3.6rem);font-weight:900;letter-spacing:2px;margin-bottom:6px;
  background:linear-gradient(120deg,var(--primary-deep) 30%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-role{font-size:1.05rem;color:var(--text-soft);margin-bottom:20px;text-wrap:balance}
.hero-desc{max-width:640px;margin:0 auto 26px;color:var(--text-soft);font-size:.98rem;text-wrap:balance}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px}
.badge{
  padding:5px 14px;border-radius:16px;font-size:.82rem;font-weight:600;
  background:var(--primary-soft);color:var(--primary-deep);
  transition:transform .2s;
}
.badge:hover{transform:translateY(-3px) scale(1.04)}
.badge.pink{background:rgba(252,232,255,.85);color:#c257d4}
[data-theme="dark"] .badge.pink{background:rgba(68,48,88,.8);color:var(--accent)}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{
  padding:11px 28px;border-radius:999px;font-size:.92rem;font-weight:700;cursor:pointer;
  border:none;transition:transform .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:8px;
  position:relative;overflow:hidden;
}
/* 按钮高光扫过（自然、克制） */
.btn::after{
  content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-20deg);transition:left .55s ease;pointer-events:none;
}
.btn:hover::after{left:135%}
.btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.btn-primary{background:linear-gradient(120deg,var(--primary),var(--accent));color:#fff}
.btn-ghost{background:var(--card);color:var(--primary-deep);border:1.5px solid var(--primary)}
.scroll-hint{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  color:var(--text-soft);font-size:.8rem;text-align:center;animation:bob 1.8s ease-in-out infinite;
}
.scroll-hint .arrow{display:block;font-size:1.2rem;margin-top:2px}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
/* ============ 卡片网格 ============ */
.grid{display:grid;gap:20px}
.card{
  background:rgba(255,255,255,.5);border:1px solid var(--card-border);border-radius:18px;
  padding:26px;box-shadow:var(--shadow);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
[data-theme="dark"] .card{background:rgba(42,33,64,.55)}
/* 悬停：轻微抬升 + 主色边框高亮 */
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
/* ============ 亮点成果 ============ */
.hl-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.hl-num{
  font-size:2.2rem;font-weight:900;line-height:1.2;
  background:linear-gradient(120deg,var(--primary-deep),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hl-label{font-weight:700;margin:4px 0 6px}
.hl-desc{font-size:.86rem;color:var(--text-soft)}
.hl-icon{font-size:1.6rem;margin-bottom:10px}
/* ============ Tabs ============ */
.tabs-bar{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  background:var(--bar-track);border-radius:30px;padding:6px;width:fit-content;margin:0 auto 32px;
}
.tab-btn{
  padding:9px 22px;border-radius:24px;border:none;background:transparent;cursor:pointer;
  color:var(--text-soft);font-size:.92rem;font-weight:700;font-family:inherit;
  transition:background .2s,color .2s;
}
.tab-btn[aria-selected="true"]{background:var(--card);color:var(--primary-deep);box-shadow:var(--shadow)}
.tab-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tab-panel[hidden]{display:none}
.cert-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.cert-tag{
  display:inline-block;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:12px;
  background:var(--primary-soft);color:var(--primary-deep);margin-bottom:10px;
}
.cert-tag.teacher{background:rgba(252,232,255,.85);color:#c257d4}
[data-theme="dark"] .cert-tag.teacher{background:rgba(68,48,88,.8);color:var(--accent)}
.cert-name{font-weight:700;font-size:.95rem;margin-bottom:6px}
.cert-meta{font-size:.82rem;color:var(--text-soft)}
.honor-item{display:flex;gap:14px;align-items:flex-start}
.honor-medal{font-size:1.4rem;flex-shrink:0;margin-top:2px}
.honor-period{font-size:.78rem;color:var(--primary-deep);font-weight:700}
.honor-name{font-weight:700;font-size:.95rem}
/* ============ 证书图集 ============ */
.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.g-card{overflow:hidden;padding:0;cursor:zoom-in}
.g-card .g-thumb{aspect-ratio:4/3;overflow:hidden;background:var(--bar-track)}
.g-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
.g-card:hover img{transform:scale(1.07)}
.g-card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.g-info{padding:13px 18px 15px}
.g-title{font-weight:700;font-size:.9rem}
.g-meta{font-size:.76rem;color:var(--text-soft)}
/* 灯箱预览 */
#lightbox{
  position:fixed;inset:0;z-index:300;background:rgba(28,20,48,.85);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .3s;cursor:zoom-out;
}
#lightbox.show{opacity:1;pointer-events:auto}
#lightbox img{max-width:92vw;max-height:82vh;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.lb-cap{margin-top:16px;color:#f3edfd;font-size:.95rem;font-weight:600;text-align:center;padding:0 20px}
.lb-close{
  position:absolute;top:18px;right:26px;font-size:2rem;color:#fff;
  background:none;border:none;cursor:pointer;line-height:1;opacity:.85;
}
.lb-close:hover{opacity:1}
/* ============ 技能矩阵 ============ */
.skill-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.skill-cat{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:16px;font-size:1.02rem}
.skill-cat .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(120deg,var(--primary),var(--accent))}
.skill-row{margin-bottom:14px}
.skill-row .sr-head{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:5px}
.skill-row .sr-pct{color:var(--text-soft);font-size:.78rem}
.bar{height:9px;border-radius:6px;background:var(--bar-track);overflow:hidden}
.bar i{
  display:block;height:100%;border-radius:6px;width:0;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  transition:width 1s cubic-bezier(.22,.8,.3,1);
}
.skill-tags{display:flex;flex-wrap:wrap;gap:7px}
.skill-tags .badge{font-size:.78rem;padding:4px 12px}
/* ============ 教育时间线 ============ */
.timeline{max-width:640px;margin:0 auto;position:relative;padding-left:28px}
.timeline::before{
  content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(var(--primary),var(--accent));border-radius:2px;
}
.tl-item{position:relative;margin-bottom:28px}
.tl-item:last-child{margin-bottom:0}
.tl-item::before{
  content:"";position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:3px solid var(--primary);
}
.tl-time{font-size:.8rem;color:var(--primary-deep);font-weight:700}
.tl-title{font-weight:800;font-size:1.02rem;margin:2px 0}
.tl-desc{font-size:.88rem;color:var(--text-soft)}
/* ============ 页脚 ============ */
footer{
  text-align:center;padding:60px 24px 40px;color:var(--text-soft);font-size:.86rem;
  text-shadow:0 1px 8px rgba(250,247,255,.85),0 0 3px rgba(250,247,255,.9);
}
[data-theme="dark"] footer{text-shadow:0 1px 8px rgba(20,15,32,.9)}
footer .heart{color:var(--accent)}
footer .foot-contact{margin-bottom:10px;font-weight:700;color:var(--text)}
/* ============ 返回顶部 & 提示 ============ */
#toTop{
  position:fixed;right:24px;bottom:24px;z-index:90;
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(120deg,var(--primary),var(--accent));color:#fff;font-size:1.15rem;
  box-shadow:var(--shadow-hover);opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .25s,transform .25s;
}
#toTop.show{opacity:1;transform:translateY(0);pointer-events:auto}
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:200;
  background:var(--card);color:var(--text);border:1px solid var(--card-border);
  backdrop-filter:blur(12px);
  padding:10px 22px;border-radius:24px;font-size:.88rem;font-weight:600;
  box-shadow:var(--shadow-hover);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* ============ 入场动画 ============ */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
/* ============ 响应式 ============ */
@media (max-width:640px){
  .hero-name{font-size:2rem}
  nav{width:calc(100% - 20px);top:10px}
  .nav-inner{padding:0 8px 0 16px;gap:10px}
  .nav-links{display:none}
  .panel{padding:32px 22px}
  #hero .panel{padding:44px 22px}
  .card{padding:20px}
}
/* 矮屏/小屏隐藏滚动提示，避免与内容重叠 */
@media (max-height:620px),(max-width:480px){
  .scroll-hint{display:none}
}
/* ============ Galaxy 透明主题：内容直接浮于清晰视频之上 ============ */
:root{
  --text:#ffffff;
  --text-soft:rgba(255,255,255,.86);
  --card:rgba(255,255,255,.10);
  --card-border:rgba(255,255,255,.24);
  --primary-soft:rgba(255,255,255,.16);
  --nav-bg:rgba(43,26,74,.32);
  --bar-track:rgba(255,255,255,.18);
  --line:rgba(255,255,255,.25);
  --overlay:linear-gradient(180deg,rgba(64,32,105,.26),rgba(64,32,105,.10) 45%,rgba(64,32,105,.34));
}
[data-theme="dark"]{
  --card:rgba(20,12,40,.35);
  --card-border:rgba(200,170,255,.25);
  --primary-soft:rgba(80,60,120,.5);
  --nav-bg:rgba(20,12,38,.55);
  --bar-track:rgba(0,0,0,.3);
  --overlay:linear-gradient(180deg,rgba(25,12,48,.5),rgba(25,12,48,.3) 45%,rgba(25,12,48,.55));
}
/* 面板全透明：白底消失，内容直接与视频同屏展示 */
.panel{
  background:transparent;border:none;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  text-shadow:0 1px 14px rgba(40,15,80,.45);
}
/* 标题 / 姓名 / 数字：浅色渐变，贴合银河氛围 */
h2.sec-title,.hero-name,.hl-num{
  background:linear-gradient(120deg,#ffffff 20%,#ffd6f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;
}
/* 卡片：极轻薄白玻，既通透又保可读 */
.card{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
[data-theme="dark"] .card{background:rgba(20,12,40,.35)}
/* 徽章与标签 */
.badge{background:rgba(255,255,255,.16);color:#fff}
.badge.pink{background:rgba(255,255,255,.24);color:#ffe3f8}
[data-theme="dark"] .badge.pink{background:rgba(120,80,150,.4);color:#ffd6f7}
.hero-tag{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.5)}
.cert-tag{background:rgba(255,255,255,.16);color:#fff}
.cert-tag.teacher{background:rgba(255,255,255,.24);color:#ffe3f8}
[data-theme="dark"] .cert-tag.teacher{background:rgba(120,80,150,.4);color:#ffd6f7}
.honor-period,.tl-time{color:#ffd6f7}
/* 胶囊导航：深色玻璃 + 白字 */
.icon-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(255,255,255,.2)}
/* 幽灵按钮 */
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.6)}
/* Tabs */
.tab-btn{color:rgba(255,255,255,.86)}
.tab-btn[aria-selected="true"]{background:rgba(255,255,255,.88);color:#7a5cd6}
/* 时间线 */
.timeline::before{background:linear-gradient(rgba(255,255,255,.75),#ffd6f7)}
.tl-item::before{background:transparent;border-color:#fff}
/* 页脚 */
footer{color:rgba(255,255,255,.86);text-shadow:0 1px 10px rgba(40,15,80,.5)}
[data-theme="dark"] footer{text-shadow:0 1px 10px rgba(0,0,0,.6)}
footer .foot-contact{color:#fff}
/* Toast 深色玻璃 */
#toast{background:rgba(43,26,74,.6);color:#fff;border-color:rgba(255,255,255,.25)}
/* ============ 打印样式 ============ */
@media print{
  nav,#toTop,#toast,#video-layer,#overlay,#glow,#progressBar,#lightbox,.scroll-hint,.hero-btns,.tabs-bar{display:none!important}
  body{background:#fff;color:#222}
  #heroTag,#heroName,#heroRole,#heroDesc,#heroBadges{opacity:1!important;transform:none!important;animation:none!important}

/* ================= 工具函数 ================= */

  if (html != null) d.innerHTML = html;
  return d;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      .then(()=>toast("邮箱已复制：" + addr))
      .catch(()=>fallbackCopy(addr));
  } else {
    fallbackCopy(addr); /* file:// 或老旧浏览器的降级方案 */
  }
});
function fallbackCopy(addr){
  const ta = document.createElement("textarea");
  ta.value = addr;
  ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  ta.remove();
  toast(ok ? "邮箱已复制：" + addr : "邮箱：" + addr);
}

  btn.setAttribute("aria-selected", i===0 ? "true" : "false");
  btn.tabIndex = i===0 ? 0 : -1;
  tabsBar.appendChild(btn);

  const panel = el("div","tab-panel");
  panel.id = "panel-"+t.id;
  panel.setAttribute("role","tabpanel");
  panel.setAttribute("aria-labelledby","tab-"+t.id);
  if (i!==0) panel.hidden = true;

    const thumb = el("div","g-thumb");

    thumb.appendChild(img);
    const info = el("div","g-info");
    info.append(
      el("div","g-title",esc(g.title)),
      el("div","g-meta",esc(g.meta))
    );

    });
    grid.appendChild(card);

function activateTab(idx, focus){
  const btns = [...tabsBar.querySelectorAll('[role="tab"]')];
  btns.forEach((b,i)=>{
    const on = i===idx;
    b.setAttribute("aria-selected", on);
    b.tabIndex = on ? 0 : -1;
    document.getElementById(b.getAttribute("aria-controls")).hidden = !on;
    if (on && focus) b.focus();
  });
}
tabsBar.addEventListener("click", e=>{
  const b = e.target.closest('[role="tab"]');
  if (b) activateTab([...tabsBar.children].indexOf(b));
});
tabsBar.addEventListener("keydown", e=>{
  if (e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
  const btns = [...tabsBar.querySelectorAll('[role="tab"]')];
  let idx = btns.findIndex(b=>b.getAttribute("aria-selected")==="true");
  idx = e.key==="ArrowRight" ? (idx+1)%btns.length : (idx-1+btns.length)%btns.length;
  activateTab(idx, true);
  e.preventDefault();
});

/* ============================================================
   滚动驱动核心：进度(0-1) → 视频播放 + 视差 + 进度条
   ============================================================ */
const video = $("#bgVideo");
const videoLayer = $("#video-layer");
const progressBar = $("#progressBar");
const parallaxEls = [...document.querySelectorAll(".parallax")];

let duration = 0;          // 视频时长（元数据加载后获得）
let videoReady = false;
let targetProgress = 0;    // 目标滚动进度 0-1
let smoothProgress = 0;    // 平滑后的进度（lerp）
let ticking = false;

video.addEventListener("loadedmetadata", ()=>{
  duration = video.duration || 0;
  videoReady = duration > 0;
  video.pause();           // 只用手动 seek，永不自动播放
  try{ video.currentTime = 0.001; }catch(e){} /* 强制渲染首帧，避免首屏黑底 */
});
/* 视频加载失败兜底：显示渐变背景（CSS body 背景已兜底） */
video.addEventListener("error", ()=>{
  videoReady = false;
  videoLayer.style.display = "none";
});

/* 计算滚动进度（0-1） */
function computeProgress(){
  const docH = document.documentElement.scrollHeight - window.innerHeight;
  return docH > 0 ? Math.min(1, Math.max(0, window.scrollY / docH)) : 0;
}

/* rAF 主循环：平滑逼近目标进度，统一驱动所有动画 */
function rafLoop(){
  /* 线性插值：系数越小越平滑（有惯性感） */
  smoothProgress += (targetProgress - smoothProgress) * (reduceMotion ? 1 : 0.14);
  if (Math.abs(targetProgress - smoothProgress) < 0.0005) smoothProgress = targetProgress;

  /* 1) 滚动 → 视频播放进度（0-100% 完整映射） */
  if (videoReady){
    const targetTime = smoothProgress * duration;
    /* 仅在差距超过约 1 帧时才 seek，避免高频解码卡顿 */
    if (Math.abs(video.currentTime - targetTime) > 0.04){
      video.currentTime = targetTime;
    }
  }

  /* 2) 视频层视差：背景层轻微上移，速度慢于前景 */
  if (!reduceMotion){
    videoLayer.style.transform = "translateY(" + (smoothProgress * -6) + "vh)";
    video.style.transform = "scale(1.12) translateY(" + (smoothProgress * 3) + "%)";

    /* 3) 前景面板视差：按各自 speed 产生位移差 */
    const vh = window.innerHeight;
    parallaxEls.forEach(elm=>{
      const r = elm.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) return; /* 离屏跳过 */
      const speed = parseFloat(elm.dataset.speed || "0.08");
      const offset = (r.top + r.height / 2 - vh / 2) * -speed;
      elm.style.transform = "translateY(" + offset.toFixed(1) + "px)";
    });
  }

  /* 4) 顶部进度条 */
  progressBar.style.width = (smoothProgress * 100).toFixed(2) + "%";

  /* 滚动停止后退出循环，节省性能 */
  if (smoothProgress !== targetProgress){
    requestAnimationFrame(rafLoop);
  } else {
    ticking = false;
  }
}

function onScroll(){
  targetProgress = computeProgress();
  if (!ticking){
    ticking = true;
    requestAnimationFrame(rafLoop);
  }
}
window.addEventListener("scroll", onScroll, {passive:true});
window.addEventListener("resize", onScroll, {passive:true});
onScroll(); /* 初始化 */

/* ================= 主题切换 ================= */
const themeBtn = $("#themeBtn");
function setTheme(t){
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t==="dark" ? "☀️" : "🌙";
  try{ localStorage.setItem("resume-theme", t); }catch(e){}
}
const saved = (()=>{ try{return localStorage.getItem("resume-theme")}catch(e){return null} })();
const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
setTheme(saved || (prefersDark ? "dark" : "light"));
themeBtn.addEventListener("click",()=>{
  setTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark");
});

/* ================= 打印 ================= */
$("#printBtn").addEventListener("click",()=>window.print());

/* ================= 返回顶部 ================= */
const toTop = $("#toTop");
window.addEventListener("scroll",()=>{
  toTop.classList.toggle("show", window.scrollY > 400);
},{passive:true});
toTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

/* ================= Toast ================= */
let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ================= 入场动画 & 技能条 & 数字计数 ================= */
/* 数字计数：从 0 缓动到目标值（约 1.1s，三次方缓出） */
function countUp(node){
  const target = parseInt(node.dataset.target, 10);
  const suffix = node.dataset.suffix || "";
  if (isNaN(target) || reduceMotion){ node.textContent = node.dataset.target + suffix; return; }
  const dur = 1100, t0 = performance.now();
  (function step(t){
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(target * eased) + suffix;
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
/* 章节标题也加入滚动淡入 */
document.querySelectorAll(".sec-title,.sec-sub").forEach(d=>d.classList.add("reveal"));

const io = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if (!en.isIntersecting) return;
    en.target.classList.add("in");
    en.target.querySelectorAll(".bar i").forEach(f=>{ f.style.width = f.dataset.w; });
    en.target.querySelectorAll(".hl-num[data-target]").forEach(countUp);
    io.unobserve(en.target);
  });
},{threshold:.15});
document.querySelectorAll(".reveal").forEach(d=>io.observe(d));

/* ================= 导航：滚动后磨砂加深 ================= */
const navEl = document.querySelector("nav");
window.addEventListener("scroll",()=>{
  navEl.classList.toggle("scrolled", window.scrollY > 40);
},{passive:true});

/* ================= 导航高亮 ================= */
const navAs = [...$("#navLinks").children];
const secIO = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if (en.isIntersecting){
      navAs.forEach(a=>a.classList.toggle("active", a.getAttribute("href")==="#"+en.target.id));
    }
  });
},{rootMargin:"-40% 0px -55% 0px"});
sections.forEach(([id])=>{ const s=document.getElementById(id); if(s) secIO.observe(s); });

/* ================= 页脚 ================= */
$("#year").textContent = new Date().getFullYear();
$("#updateTime").textContent = "更新时间：" + new Date().toLocaleDateString("zh-CN");
</script>
</body>
